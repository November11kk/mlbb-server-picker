name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем рабочее окружение Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Автоматически подготавливаем и запускем инструмент Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Компилируем проект в APK
    - name: Build APK
      run: gradle assembleDebug

    # 5. Сохраняем готовый файл для скачивания
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MLBB-Server-Picker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
