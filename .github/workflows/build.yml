name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Загружаем код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем окружение Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Настраиваем систему сборки Gradle 8.1.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    # 4. Запускаем сборку APK с автонастройкой Android SDK
    - name: Build APK
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    # 5. Сохраняем готовый файл приложения в Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MLBB-Server-Picker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
