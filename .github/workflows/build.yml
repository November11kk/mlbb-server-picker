name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачивание файлов репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Установка Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Настройка кэширования Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Автоматическое создание Gradle Wrapper для версии 8.1.1
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.1.1

    # 5. Выдача прав на исполнение скрипта сборки
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 6. Компиляция установочного APK через Gradle Wrapper
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    # 7. Сохранение готового файла приложения
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MLBB-Server-Picker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
