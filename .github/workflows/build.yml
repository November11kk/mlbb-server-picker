name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код проекта из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем и настраиваем Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Автоматически устанавливаем и принимаем лицензии Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Настраиваем системный Gradle 8.1.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    # 5. Запускаем сборку APK прямо через системный Gradle
    - name: Build APK
      run: gradle assembleDebug --stacktrace

    # 6. Сохраняем готовый файл приложения в раздел Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MLBB-Server-Picker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
